<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>יפן דצמבר 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
.logo{width:22px;height:22px;border-radius:50%;background:#d6262b;display:inline-block;vertical-align:-3px;margin-inline-end:10px}
.tools{display:flex;gap:16px;margin-top:12px}
.tools button{background:none;border:0;padding:0;color:#3d5a80;text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:14px;cursor:pointer}

.locbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:#73777d}
.locbar button{background:none;border:1px solid #ececea;border-radius:99px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer;color:#1d1f22}
.locbar button.on{border-color:#d6262b;color:#d6262b}
.locdot{width:8px;height:8px;border-radius:50%;background:#c9c9c4}
.locbar.on .locdot{background:#d6262b;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
#here{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:#fff;border:1px solid #d6262b;border-radius:10px;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
#here .hh{font-weight:700}
#here .hb{font-size:15px}
#here .ha{display:flex;flex-wrap:wrap;gap:14px}
#here .ha button{background:none;border:0;padding:0;color:#3d5a80;text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.locbar.on .locdot{animation:none}}

.term{display:inline;background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:1px dotted #3d5a80;cursor:pointer;text-align:inherit}
.term .en{font-size:.88em;color:#3d5a80;direction:ltr;unicode-bidi:isolate}
#tip{position:fixed;inset:auto 0 0 0;z-index:15;background:#fff;border-top:1px solid #ececea;box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tip .in{max-width:600px;margin:0 auto;display:grid;gap:6px}
#tip .h{font-size:18px;font-weight:700}
#tip .en{color:#3d5a80;direction:ltr;unicode-bidi:isolate;font-weight:600}
#tip .jp{font-size:20px}
#tip .x{justify-self:start;background:#f3f3f1;border:0;border-radius:99px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.rj{font-size:.88em;color:#3d5a80;direction:ltr;unicode-bidi:isolate;font-style:italic}
dl.gloss{margin:0;display:grid;gap:10px;font-size:15px}
dl.gloss dt .en{color:#3d5a80;direction:ltr;unicode-bidi:isolate}
dl.gloss dd{margin:2px 0 0;color:#73777d}

.wx{margin-top:14px;display:grid;gap:6px}
.wx .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:#73777d}
.wx .wh b{color:#1d1f22;font-size:15px}
.wx .row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wx .d{flex:0 0 auto;min-width:64px;border:1px solid #ececea;border-radius:10px;padding:6px 8px;text-align:center;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.wx .d.trip{border-color:#c9d3e1;background:#f2f5f9}
.wx .d.rain .p{color:#3d5a80;font-weight:600}
.wx .d .i{font-size:20px;line-height:1.2}
.wx .d .t b{font-weight:700}
.wx .d .t span{color:#73777d}
.wx .note{font-size:13px;color:#73777d}
.wx .tabs{display:flex;gap:4px}
.wx .tabs button{background:none;border:1px solid #ececea;border-radius:99px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer;color:#73777d}
.wx .tabs button[aria-pressed="true"]{border-color:#1d1f22;color:#1d1f22}

.srch{position:relative;margin-bottom:12px}
.srch input{width:100%;font:inherit;font-size:16px;padding:10px 38px 10px 12px;border:1px solid #ececea;border-radius:10px;background:#f6f6f4;color:#1d1f22}
.srch input:focus{outline:none;border-color:#3d5a80;background:#fff}
.srch .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:#73777d;pointer-events:none;font-size:15px}
.srch .clr{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#73777d;font-size:18px;cursor:pointer;padding:4px 8px}
#sres{display:grid;gap:2px;margin-bottom:14px}
#sres .hd{font-size:12px;color:#73777d;letter-spacing:.04em;margin:8px 0 2px}
#sres button.r{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid #ececea;padding:9px 2px;font:inherit;cursor:pointer;color:#1d1f22}
#sres button.r:hover{background:#f6f6f4}
#sres .r .w{font-size:12px;color:#3d5a80}
#sres .r .x{font-size:15px}
#sres .r .y{font-size:13px;color:#73777d;direction:ltr;unicode-bidi:isolate}
#sres mark{background:#fdeeb5;color:inherit;border-radius:2px}
#sres .none{color:#73777d;font-size:15px;padding:8px 0}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{background:#fdeeb5}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:#fdeeb5}}

.srch .cam{position:absolute;inset-inline-end:36px;top:50%;transform:translateY(-50%);background:none;border:0;color:#3d5a80;font:inherit;font-size:14px;cursor:pointer;padding:4px 8px;text-decoration:underline;text-underline-offset:3px}
.srch input{padding-inline-end:110px}
#ocrBox{display:grid;gap:8px;margin-bottom:12px;padding:12px;border:1px solid #ececea;border-radius:10px}
#ocrBox img{max-height:140px;width:auto;border-radius:6px;justify-self:start}
#ocrBox .st{font-size:14px;color:#73777d}
#ocrBox .raw{font-family:"Noto Sans JP",sans-serif;font-size:14px;color:#73777d;direction:ltr;text-align:right;overflow-wrap:anywhere}
#ocrBox .hits{display:flex;flex-wrap:wrap;gap:8px}
#ocrBox .hits button{background:#f2f5f9;border:1px solid #c9d3e1;border-radius:8px;padding:6px 10px;font:inherit;font-size:15px;cursor:pointer;text-align:start}
#ocrBox .hits .jp{font-weight:700}
#ocrBox .hits .en{font-size:13px;color:#3d5a80;direction:ltr;unicode-bidi:isolate}
#ocrBox .x{justify-self:start;background:none;border:0;color:#73777d;text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
.bar2{height:4px;background:#ececea;border-radius:4px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:#3d5a80;transition:width .2s}

.wxc{position:absolute;top:30px;inset-inline-end:0;background:none;border:1px solid #ececea;border-radius:99px;padding:3px 10px;font:inherit;font-size:13px;color:#1d1f22;cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.wxc .i{font-size:15px}.wxc .l{color:#73777d;font-size:12px}
.wxp{position:absolute;top:62px;inset-inline-end:0;z-index:8;background:#fff;border:1px solid #ececea;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:10px;max-width:min(92vw,520px);display:grid;gap:6px}
.wxp .row{display:flex;gap:6px;overflow-x:auto}
.wxp .d{flex:0 0 auto;min-width:56px;text-align:center;font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums;border:1px solid #ececea;border-radius:8px;padding:4px 6px}
.wxp .d.trip{background:#f2f5f9;border-color:#c9d3e1}
.wxp .d .i{font-size:17px}
.wxp .d span{color:#73777d}
.wxp .note{font-size:12px;color:#73777d}
h1{padding-inline-end:120px}

/* header composition */
header{padding-block:14px 16px!important}
.topbar{position:relative;display:flex;align-items:center;gap:12px;min-height:30px;margin-bottom:14px}
.topbar .tools{margin:0!important;display:flex;gap:14px}
.wxc{position:static!important;margin-inline-start:auto}
.wxp{top:38px!important;inset-inline-end:0}
h1{padding-inline-end:0!important;line-height:1.2}
.meta{margin-top:4px}
.infobar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:14px;padding-top:12px;border-top:1px solid #ececea}
.infobar .times{margin:0!important;gap:4px 14px}
.infobar .locbar{margin:0!important;font-size:13px}
.infobar .locbar button{padding:2px 10px;font-size:13px}
.srch{margin-bottom:14px}
.srch input{padding-inline-end:96px}

.tp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tp .tpl{font-size:12px;color:#73777d;letter-spacing:.02em}
.tpb{background:#fff;border:1px solid #c9d3e1;border-radius:99px;padding:4px 10px;font:inherit;font-size:13px;color:#3d5a80;cursor:pointer}
.tpb:hover{background:#f2f5f9}
#toast2{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:#1d1f22;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,420px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}

.srch .cams{position:absolute;inset-inline-end:36px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px}
.srch .cams .cam{position:static;transform:none;padding:4px 4px}
.srch .cams .sep{color:#c9c9c4}

#ocrBox .wrap{position:relative;justify-self:start;max-width:100%;touch-action:none}
#ocrBox canvas{display:block;max-width:100%;max-height:260px;width:auto;height:auto;border-radius:6px;cursor:crosshair}
#ocrBox .sel{position:absolute;border:2px solid #d6262b;background:rgba(214,38,43,.08);border-radius:3px;pointer-events:none}
#ocrBox .hint{font-size:12px;color:#73777d}
#ocrBox .sec{font-size:12px;color:#73777d;letter-spacing:.04em;margin-top:4px}
#ocrBox .tr{font-size:18px;line-height:1.5;white-space:pre-line;font-weight:600}
#ocrBox .jaBox summary{font-size:13px;color:#3d5a80;cursor:pointer}
#ocrBox .jaBox textarea{width:100%;min-height:70px;margin-top:6px;font-family:"Noto Sans JP",sans-serif;font-size:15px;background:#f6f6f4;border:1px solid #ececea;border-radius:8px;padding:8px}

details.pack{border:1px solid #ececea;border-radius:10px;padding:8px 12px}
details.pack summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.pack summary::-webkit-details-marker{display:none}
details.pack summary::after{content:"‹";float:inline-end;color:#73777d;transition:transform .2s}
details.pack[open] summary::after{transform:rotate(-90deg)}
details.pack[open] summary{margin-bottom:6px}

/* ---- larger text throughout ---- */
body{font-size:18px!important}
h1{font-size:29px!important}
.meta,.times,.infobar .locbar{font-size:15.5px!important}
.head .t{font-size:20px!important}
.head .d,.tag{font-size:15.5px!important}
h3{font-size:14.5px!important}
.sub,.dur,.warn,.key{font-size:16px!important}
dl.facts,ul.plain,dl.gloss{font-size:16.5px!important}
.card .he,.card .ro{font-size:15.5px!important}
.card .ja{font-size:22px!important}
.srch input{font-size:17.5px!important}
#sres .r .x{font-size:17px!important}
#ocrBox .tr{font-size:20px!important}
footer{font-size:14.5px!important}
/* ---- everything you can press: red and bold ---- */
:root{--act:#c41e24}
a,.show,.tpb,.tools button,.cam,#locBtn,.wxc,#ocrBox .x,.reset,#hereA button,#ocrBox .hits button,.tp .tpl,#tipX,#close{color:var(--act)!important;font-weight:700!important}
.show,.tools button,.cam,#ocrBox .x,.reset,#hereA button,a{text-decoration-color:currentColor}
.tpb,#locBtn,.wxc,#ocrBox .hits button{border-color:var(--act)!important}
.tpb,#locBtn,.show,.tools button,.cam{font-size:16px!important}
.term .en{color:var(--act)!important;font-weight:700}
.term{border-bottom-color:var(--act)!important}
.card{border-color:#e6b8ba}
.card .he{color:var(--act)!important;font-weight:700}
.btn,.btn.pri{font-weight:700}

/* ---- open days: still a draft, shown in soft blue ---- */
:root{--tent:#3a78c2;--tent-bg:#f1f6fc}
.st.tent .head .t{color:var(--tent)}
.st.tent .body,.st.tent .body .sub,.st.tent .body .dur,.st.tent .body h3,.st.tent .head .d,.st.tent .body .rj,.st.tent .body ul.plain{color:var(--tent)!important}
.st.tent .body .warn{color:var(--tent);background:var(--tent-bg)}
.st.tent{border-bottom-style:dashed}
.st.tent.next{background:var(--tent-bg);box-shadow:inset -3px 0 0 var(--tent)}
.tbadge{display:inline-block;vertical-align:middle;font-size:12px!important;font-weight:600;color:var(--tent);border:1px dashed var(--tent);border-radius:99px;padding:0 8px;margin-inline-start:6px}
ul.chk li.tentli .txt{color:var(--tent)}
ul.chk li.tentli .lbl::after{content:"טיוטה";font-size:11px;font-weight:600;border:1px dashed var(--tent);border-radius:99px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}

.msgbox{white-space:pre-line;margin:6px 0 4px;background:#f6f6f4;border:1px solid #ececea;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.55;user-select:text}

.tgroup{border-bottom:1px dashed var(--tent)}
.tg-head{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;width:100%;background:none;border:0;padding:18px 0;text-align:start;cursor:pointer}
.tg-head .t{font-size:20px;font-weight:700;color:var(--tent)}
.tg-head .d{font-size:15.5px;color:var(--tent)}
.tg-head .num,.tg-head .tag{color:var(--tent);font-size:15.5px}
.tgroup.open .tg-head .chev{transform:rotate(-90deg)}
.tg-body{padding-inline-start:14px;border-inline-start:2px dashed var(--tent);margin-bottom:10px}
details.tdraft{border:1px dashed var(--tent);border-radius:10px;padding:8px 12px;color:var(--tent)}
details.tdraft summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none}
details.tdraft summary::-webkit-details-marker{display:none}
details.tdraft summary::after{content:"‹";float:inline-end;transition:transform .2s}
details.tdraft[open] summary::after{transform:rotate(-90deg)}
details.tdraft[open] summary{margin-bottom:6px}

.price{display:inline-block;font-size:14.5px;font-weight:700;color:#1d1f22;background:#fff4d6;border:1px solid #f0d78a;border-radius:6px;padding:0 7px;margin-inline-end:6px;font-variant-numeric:tabular-nums;white-space:nowrap}

.price{background:none!important;border:1.5px solid #b7791f!important;color:#9a5b0f!important;font-weight:700!important;font-size:15px!important;padding:0 7px!important;border-radius:6px!important;box-shadow:none}
.price.paid{border-color:#1f9d55!important;color:#1a7f45!important}
dl.paidlist dd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}

/* links in blue (buttons stay red) */
a{color:#1a5fb4!important;font-weight:600!important;text-decoration:underline;text-underline-offset:3px}
.applinks{font-size:15.5px}
.qrbox{border:1px solid #e3e3e3;border-radius:12px;padding:12px;margin:10px 0}.qrh{font-weight:700;margin-bottom:8px}.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qrcell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.qrn{font-weight:700}.qrimg{width:100%;max-width:220px;border-radius:8px;cursor:zoom-in}.qrload{cursor:pointer}.qrdel{background:none;border:0;color:#888;font-size:.85em;text-decoration:underline}.qrfull{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px}.qrfull img{max-width:100%;max-height:100%}
</style>

<style>
/* Layout: one quiet white column; the trip as an accordion of stages; each stage is a checklist, finished stages fold away and the next one is lifted */
:root{
  --bg:#ffffff; --fg:#1d1f22; --muted:#73777d; --rule:#ececea; --soft:#f6f6f4; --next:#f2f5f9; --accent:#3d5a80; --done:#5f8f6d; --warn:#9a4f28; --warn-bg:#fbf5f1;
  --f:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:600px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-block:32px 20px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.times{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.times b{color:var(--fg);font-weight:600}

.acc{border-top:1px solid var(--rule)}
.st{border-bottom:1px solid var(--rule);transition:background .25s}
.head{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;width:100%;background:none;border:0;padding:18px 0;text-align:start}
.num{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.head .t{font-size:18px;font-weight:700;line-height:1.3}
.head .d{font-size:14px;color:var(--muted)}
.tag{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{display:inline-block;transition:transform .2s;margin-inline-start:8px}
.st.open .chev{transform:rotate(-90deg)}

.st.done .num,.st.done .tag{color:var(--done)}
.st.done .head .t{color:var(--muted);font-weight:600}
.st.next{background:var(--next);border-radius:10px;border-bottom-color:transparent;margin-block:6px;box-shadow:inset -3px 0 0 var(--accent)}
.st.next .head{padding-inline:14px}
.st.next .body{padding-inline:14px 54px}
.st.next .num,.st.next .tag{color:var(--accent);font-weight:700}
.body{padding:0 40px 22px 0;display:grid;gap:14px}

h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:6px 0 0}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.chk li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:5px 0}
ul.chk input{accent-color:var(--done);width:20px;height:20px;margin:3px 0 0;cursor:pointer}
ul.chk li.ck .txt{color:var(--muted)}
ul.chk li.ck .txt .lbl{text-decoration:line-through}
.txt label{cursor:pointer}
.dur{color:var(--muted);font-size:14px}
.jp{font-family:var(--jp);font-weight:500}
.big{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:16px;font-size:15px}
.warn{font-size:14px;color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:6px}
.key{font-size:15px;background:var(--soft);padding:10px 12px;border-radius:6px}
.show{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:15px;white-space:nowrap}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
dl.facts dt{color:var(--muted)}
dl.tl dt{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.n{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:64px;background:var(--soft);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical}
ul.plain{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:15px}
.cards{display:grid;gap:8px}
.card{display:block;width:100%;text-align:start;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--accent)}
.card .he{font-size:14px;color:var(--muted)}
.card .ja{font-family:var(--jp);font-weight:700;font-size:20px;line-height:1.45;direction:ltr;text-align:right}

function qrBox(){return `<div class="qrbox"><div class="qrh">קודי QR לכניסה (Visit Japan Web)</div><div class="qrgrid">${QRS.map(([k,n,u])=>{let d=null;try{d=localStorage.getItem("jp26:qr-"+k)}catch(e){}return `<div class="qrcell"><div class="qrn">${n}</div>${d?`<img src="${d}" class="qrimg" data-qrfull="${k}" alt="QR ${n}">`:`<label class="show qrload">לטעון מהגלריה<input type="file" accept="image/*" data-qrin="${k}" hidden></label>`}<a href="${u}" target="_blank" rel="noopener">לפתוח בדרייב</a>${d?`<button class="qrdel" data-qrdel="${k}">להחליף</button>`:""}</div>`}).join("")}</div><div class="sub">התמונה נשמרת רק בטלפון הזה, לא באתר. לחיצה על הקוד מגדילה אותו למסך מלא.</div></div>`}
document.addEventListener("change",e=>{const i=e.target.closest("[data-qrin]");if(!i||!i.files[0])return;const k=i.dataset.qrin,f=i.files[0],img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);try{localStorage.setItem("jp26:qr-"+k,c.toDataURL("image/png"));toast2("נשמר בטלפון")}catch(err){toast2("לא הצלחתי לשמור")}URL.revokeObjectURL(url);render()};img.src=url});
document.addEventListener("click",e=>{const d=e.target.closest("[data-qrdel]");if(d){try{localStorage.removeItem("jp26:qr-"+d.dataset.qrdel)}catch(err){}render();return}const f=e.target.closest("[data-qrfull]");if(f){const o=document.createElement("div");o.className="qrfull";o.innerHTML=`<img src="${f.src}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}});
const store={get(k,d){try{const v=localStorage.getItem("jp26:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("jp26:"+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.startsWith("jp26:")).forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const mem={}; // fallback when storage is unavailable
const isChecked=k=>k in mem?mem[k]:!!store.get("c:"+k,false);
const keysOf=s=>[...s.html().matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]);
const stat=s=>{const ks=keysOf(s);const d=ks.filter(isChecked).length;return {n:ks.length,d,done:ks.length>0&&d===ks.length}};
const nextIdx=()=>STEPS.findIndex(s=>!s.always&&!stat(s).done);

let open=store.get("open3",null);
if(open===null)open=nextIdx();
const acc=document.getElementById("acc");
function stepHtml(s,i,nx){
    const st=stat(s),isNext=i===nx,isOpen=i===open;
    const tag=s.always?"":st.done?"הושלם":isNext?`הבא · ${st.d}/${st.n}`:st.d?`${st.d}/${st.n}`:"";
    return `<div class="st ${s.tent?"tent":""} ${st.done&&!s.always?"done":""} ${isNext?"next":""} ${isOpen?"open":""}" id="${s.id}">
     <button class="head" data-i="${i}" aria-expanded="${isOpen}"><span class="num">${s.always?"·":st.done?"✓":i+1}</span>
      <span><div class="t">${s.t}</div><div class="d">${s.d}</div></span>
      <span class="tag"><span class="tt">${tag}</span><span class="chev">‹</span></span></button>
     <div class="body" ${isOpen?"":"hidden"}>${s.html()}</div></div>`}
function render(){
  const nx=nextIdx();
  const tIdx=STEPS.map((s,i)=>s.tent?i:-1).filter(i=>i>=0);
  if(tIdx.includes(open))tgOpen=true;
  let html="";
  STEPS.forEach((s,i)=>{
    if(s.tent&&i===tIdx[0]){
      const hasNext=tIdx.includes(nx),dates="14–24.12";
      html+=`<div class="tgroup ${tgOpen?"open":""}"><button class="tg-head" aria-expanded="${tgOpen}"><span class="num">…</span>
        <span><div class="t">הימים הפתוחים <span class="tbadge">טיוטה</span></div><div class="d">${dates} · פוג׳י, קיוטו, הירושימה, טוקיו</div></span>
        <span class="tag"><span class="tt">${hasNext?"הבא":""}</span><span class="chev">‹</span></span></button><div class="tg-body" ${tgOpen?"":"hidden"}>`}
    html+=stepHtml(s,i,nx);
    if(s.tent&&i===tIdx[tIdx.length-1])html+=`</div></div>`;
  });
  acc.innerHTML=html;
  acc.querySelectorAll("input[data-k]").forEach(c=>{c.checked=isChecked(c.dataset.k);c.closest("li").classList.toggle("ck",c.checked)});
  acc.querySelectorAll("input[data-k]").forEach(c=>{if(TENT_KEYS.has(c.dataset.k))c.closest("li").classList.add("tentli")});
  acc.querySelectorAll("ul.chk").forEach(sortList);
  acc.querySelectorAll("textarea[data-note]").forEach(t=>t.value=store.get("n:"+t.dataset.note,""));
}
let tgOpen=!!store.get("tgopen",false);
function setOpen(i){open=i;store.set("open3",i)}
acc.addEventListener("click",e=>{
  const g=e.target.closest(".tg-head");if(g){tgOpen=!tgOpen;store.set("tgopen",tgOpen);if(!tgOpen&&STEPS[open]&&STEPS[open].tent)setOpen(-1);render();return}
  const h=e.target.closest(".head");if(h){const i=+h.dataset.i;setOpen(open===i?-1:i);render()}
});
/* Like Google Keep: checked items move to the bottom of their list, unchecked ones go back to their original place */
const TENT_KEYS=new Set(["prep-2","prep-3","prep-4","prep-5","prep-6"]);
function sortList(ul){const items=[...ul.children];items.forEach((li,i)=>{if(li.dataset.o==null)li.dataset.o=i});
 items.sort((x,y)=>(x.classList.contains("ck")-y.classList.contains("ck"))||(x.dataset.o-y.dataset.o)).forEach(li=>ul.appendChild(li))}
function moveItem(li){const ul=li.parentNode,first=li.getBoundingClientRect().top;sortList(ul);
 const d=first-li.getBoundingClientRect().top;if(d&&!matchMedia("(prefers-reduced-motion: reduce)").matches){li.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:280,easing:"ease-out"})}}
acc.addEventListener("change",e=>{
  const k=e.target.dataset.k;if(!k)return;
  mem[k]=e.target.checked;store.set("c:"+k,e.target.checked);
  e.target.closest("li").classList.toggle("ck",e.target.checked);
  {const li=e.target.closest("li");setTimeout(()=>moveItem(li),180)}
  const i=STEPS.findIndex(s=>keysOf(s).includes(k));
  const st=stat(STEPS[i]);
  // update the header counter without re-rendering the open section
  if(st.done){
    setTimeout(()=>{const nx=nextIdx();setOpen(nx);render();
      if(nx>=0)document.getElementById(STEPS[nx].id).scrollIntoView({behavior:"smooth",block:"start"})},450);
  }else{
    const tag=document.querySelector(`#${STEPS[i].id} .tag`);
    if(tag)tag.querySelector(".tt").textContent=(i===nextIdx()?"הבא · ":"")+`${st.d}/${st.n}`;
  }
});
acc.addEventListener("input",e=>{if(e.target.dataset.note)store.set("n:"+e.target.dataset.note,e.target.value)});

const full=document.getElementById("full");
document.addEventListener("click",e=>{const b=e.target.closest("[data-card]");if(!b)return;e.preventDefault();const c=CARDS[b.dataset.card];if(!c)return;
  document.getElementById("fJa").innerHTML=c.ja.replace(/\n/g,"<br>");
  document.getElementById("fAddr").textContent=c.addr||"";
  document.getElementById("fRo").textContent=c.ro;document.getElementById("fHe").textContent=c.he;
  full.hidden=false;try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
  document.getElementById("close").focus()});
document.getElementById("close").onclick=()=>full.hidden=true;
full.addEventListener("click",e=>{if(e.target===full)full.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")full.hidden=true});

document.getElementById("reset").onclick=()=>document.getElementById("resetAsk").hidden=false;
document.getElementById("resetYes").onclick=()=>{store.clear();for(const k in mem)delete mem[k];setOpen(0);document.getElementById("resetAsk").hidden=true;render()};

function fmt(tz){return new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:tz,hour12:false}).format(new Date())}
function tick(){
  document.getElementById("cIL").textContent=fmt("Asia/Jerusalem");
  document.getElementById("cJP").textContent=fmt("Asia/Tokyo");
  const d=Math.ceil((new Date("2026-12-09T19:00:00+02:00")-new Date())/864e5);
  document.getElementById("cd").innerHTML=d>0?`עוד <b>${d}</b> ימים להמראה`:"";
}
render();tick();setInterval(tick,30000);

function dist(a,b,c,d){const R=6371e3,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

<script>
/* Weather: Tokyo only, as a small chip in the header. Tap for the days. Open-Meteo, no key; last result kept for offline. */
const TRIP_FROM="2026-12-10",TRIP_TO="2026-12-24";
const WMO=c=>c===0?["☀","בהיר"]:c<=2?["⛅","מעונן חלקית"]:c===3?["☁","מעונן"]:c<=48?["🌫","ערפל"]:c<=57?["🌦","טפטוף"]:c<=67?["☂","גשם"]:c<=77?["❄","שלג"]:c<=82?["☂","ממטרים"]:c<=86?["❄","שלג"]:["⛈","סופה"];
const HEDAY=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const wxChip=document.getElementById("wxChip"),wxPop=document.getElementById("wxPop");
function wxDraw(d,stale){
 const days=d.daily.time.map((t,i)=>({t,mx:Math.round(d.daily.temperature_2m_max[i]),mn:Math.round(d.daily.temperature_2m_min[i]),p:d.daily.precipitation_probability_max?.[i],c:d.daily.weather_code[i]}));
 const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});
 const inTrip=today>=TRIP_FROM&&today<=TRIP_TO;
 const show=days.filter(x=>inTrip?x.t>=today:(x.t>=TRIP_FROM&&x.t<=TRIP_TO));
 if(!show.length){
  wxChip.innerHTML=`<span class="i">❄</span><span dir="ltr">11° / 3°</span> <span class="l">טוקיו בדצמבר</span>`;
  wxPop.innerHTML=`<div class="note">תחזית לימי הנסיעה תופיע כאן כשבועיים לפני. בדצמבר בטוקיו בדרך כלל יבש ושמשי, 9–12° ביום ו־1–5° בלילה.</div>`;
 }else{
  const f=show[0],[i,l]=WMO(f.c),dt=new Date(f.t+"T12:00:00+09:00");
  wxChip.innerHTML=`<span class="i" aria-label="${l}">${i}</span><span dir="ltr">${f.mx}° / ${f.mn}°</span> <span class="l">טוקיו ${inTrip?"היום":dt.getUTCDate()+"."+(dt.getUTCMonth()+1)}</span>`;
  const rainy=show.filter(x=>x.p>=50).map(x=>x.t.slice(8)*1+".12");
  wxPop.innerHTML=`<div class="row">${show.map(x=>{const [ic,lb]=WMO(x.c),t=new Date(x.t+"T12:00:00+09:00");
   return `<div class="d ${x.t>=TRIP_FROM&&x.t<=TRIP_TO?"trip":""}" title="${lb}"><div>${HEDAY[t.getUTCDay()]} ${t.getUTCDate()}.${t.getUTCMonth()+1}</div><div class="i">${ic}</div><div><b>${x.mx}°</b> <span>${x.mn}°</span></div>${x.p!=null?`<div>${x.p}%☂</div>`:""}</div>`}).join("")}</div>
   <div class="note">${stale?"תחזית שמורה, בלי חיבור. ":""}${rainy.length?"מטריה ב־"+rainy.join(", ")+".":"בלי גשם צפוי."}</div>`;
 }
 wxChip.hidden=false;
}
wxChip.onclick=()=>{wxPop.hidden=!wxPop.hidden;wxChip.setAttribute("aria-expanded",!wxPop.hidden)};
document.addEventListener("click",e=>{if(!wxPop.hidden&&!e.target.closest("#wxPop,#wxChip")){wxPop.hidden=true;wxChip.setAttribute("aria-expanded","false")}});
async function wxLoad(){
 const url="https://api.open-meteo.com/v1/forecast?latitude=35.690&longitude=139.700&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16";
 try{const r=await fetch(url);if(!r.ok)throw 0;const d=await r.json();try{localStorage.setItem("jp26:wx:tokyo",JSON.stringify(d))}catch(e){}wxDraw(d,false)}
 catch(e){let d=null;try{d=JSON.parse(localStorage.getItem("jp26:wx:tokyo"))}catch(_){}if(d)wxDraw(d,true)}
}

<script>
/* Search across stages, show-cards and the glossary. Matches Hebrew, English, romaji (with or without long vowels) and Japanese. */
const norm=t=>(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\u0591-\u05c7]/g,"").replace(/[׳״'"`’\-–—·.,:;()?!]/g," ").replace(/\s+/g," ").trim();
const SEL="li,.warn,.key,dd,.sub,.big";
let IDX=null;
function buildIdx(){
 IDX=[];
 STEPS.forEach((st,si)=>{if(st.always)return;const box=document.createElement("div");box.innerHTML=st.html();
  box.querySelectorAll(SEL).forEach((el,ei)=>{const tx=el.textContent.replace(/\s+/g," ").trim();if(tx.length>2)IDX.push({k:"step",si,ei,title:st.t,txt:tx,n:norm(tx+" "+st.t)})});
  IDX.push({k:"step",si,ei:-1,title:st.t,txt:st.d,n:norm(st.t+" "+st.d)})});
 Object.entries(CARDS).forEach(([id,c])=>IDX.push({k:"card",id,title:c.he,txt:c.ro,ja:c.ja.replace(/\n/g,""),n:norm([c.he,c.ro,c.ja,c.addr].join(" "))}));
 Object.entries(TERMS).forEach(([id,t])=>IDX.push({k:"term",id,title:t[0],txt:t[1],ja:t[2],n:norm(t.join(" "))}));
}
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(t,words){let h=esc(t);for(const w of words){if(w.length<2)continue;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");h=h.replace(re,"<mark>$1</mark>")}return h}
function snippet(t,w){if(t.length<=110)return t;const i=Math.max(0,norm(t).indexOf(w)-40);return (i>0?"…":"")+t.slice(i,i+110)+"…"}
const q=document.getElementById("q"),sres=document.getElementById("sres"),qClr=document.getElementById("qClr"),accEl=document.getElementById("acc");
function search(){
 const raw=q.value.trim();qClr.hidden=!raw;
 if(!raw){sres.hidden=true;accEl.hidden=false;return}
 if(!IDX)buildIdx();
 const words=norm(raw).split(" ").filter(Boolean);
 const hits=IDX.filter(x=>{const c=x.c||(x.c=x.n.replace(/ /g,""));return words.every(w=>x.n.includes(w)||c.includes(w))});
 const groups=[["card","כרטיסים להראות"],["term","מקומות ומונחים"],["step","בשלבים"]];
 let html="";
 for(const [k,lab] of groups){const g=hits.filter(h=>h.k===k).slice(0,k==="step"?12:8);if(!g.length)continue;
  html+=`<div class="hd">${lab}</div>`+g.map(h=>{
   if(k==="card")return `<button class="r" data-card="${h.id}"><div class="x">${hl(h.title,words)}</div><div class="y"><span class="jp">${esc(h.ja)}</span> · ${hl(h.txt,words)}</div></button>`;
   if(k==="term")return `<button class="r" data-term="${h.id}"><div class="x">${hl(h.title,words)} <span class="y">${hl(h.txt,words)}</span></div>${h.ja?`<div class="y"><span class="jp">${esc(h.ja)}</span></div>`:""}</button>`;
   return `<button class="r" data-sgo="${h.si}:${h.ei}"><div class="w">${esc(h.title)}</div><div class="x">${hl(snippet(h.txt,words[0]),words)}</div></button>`}).join("")}
 sres.innerHTML=html||`<div class="none">לא נמצא. אפשר לנסות בעברית, באנגלית או ביפנית.</div>`;
 sres.hidden=false;accEl.hidden=true;
}
q.addEventListener("input",search);
qClr.onclick=()=>{q.value="";search();q.focus()};
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";search()}});
sres.addEventListener("click",e=>{const b=e.target.closest("[data-sgo]");if(!b)return;
 const [si,ei]=b.dataset.sgo.split(":").map(Number);
 q.value="";search();setOpen(si);render();
 const stEl=document.getElementById(STEPS[si].id);
 const want=(IDX||[]).find(x=>x.k==="step"&&x.si===si&&x.ei===ei);
 const cands=[...stEl.querySelectorAll(".body "+SEL.split(",").join(",.body "))];
 const target=ei<0?stEl:(want&&cands.find(el=>el.textContent.replace(/\s+/g," ").trim()===want.txt))||cands[ei];
 (target||stEl).scrollIntoView({behavior:"smooth",block:"center"});
 if(target){target.classList.remove("flash");void target.offsetWidth;target.classList.add("flash")}
});
</script>

<script>
/* Photo of a sign -> Japanese text recognition on the phone (Tesseract, loaded on first use) -> known words in the app */
const camBtn=document.getElementById("camBtn"),camIn=document.getElementById("camIn"),ocrBox=document.getElementById("ocrBox");
camBtn.onclick=()=>camIn.click();
let tessLoad=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(!tessLoad)tessLoad=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});return tessLoad}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);
  /* grayscale, and flip white-on-dark signs to dark-on-white, which reads better */
  const d=g.getImageData(0,0,c.width,c.height),a=d.data;let sum=0;for(let i=0;i<a.length;i+=4){const y=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=a[i+1]=a[i+2]=y;sum+=y}
  if(sum/(a.length/4)<110)for(let i=0;i<a.length;i+=4){a[i]=a[i+1]=a[i+2]=255-a[i]}
  g.putImageData(d,0,0);res(c)};img.src=URL.createObjectURL(file)})}
function vocab(){const v=[];for(const [k,t] of Object.entries(TERMS)){if(t[2])v.push({w:t[2].replace(/\s/g,""),k})}
 for(const [jp,ro] of Object.entries(JR)){if(!v.some(x=>x.w===jp)){const k=Object.keys(TERMS).find(k=>TERMS[k][2]===jp);v.push({w:jp,k,ro})}}
 v.push({w:"切符売り場",k:"s_kippu"},{w:"お手洗い",k:"s_toilet"},{w:"東海大学",k:"tokai"},{w:"湘南",k:"shonan"},{w:"各停",k:"kakueki"},{w:"空港",k:"narita"},{w:"小田急",k:"odakyu"},{w:"禁煙",k:"s_kin"});
 return v.sort((a,b)=>b.w.length-a.w.length)}
function findHits(text){const t=text.replace(/\s/g,"");const out=[],seen=new Set(),cov=new Array(t.length).fill(false);const V=vocab();
 const add=v=>{const key=v.k||v.w;if(!seen.has(key)){seen.add(key);out.push(v)}};
 /* exact matches first, then near-misses only where nothing exact was read */
 for(const v of V){let i=t.indexOf(v.w);if(i<0)continue;add(v);while(i>=0){for(let j=0;j<v.w.length;j++)cov[i+j]=true;i=t.indexOf(v.w,i+1)}}
 for(const v of V){if(v.w.length<4||seen.has(v.k||v.w))continue;
  for(let i=0;i+v.w.length<=t.length;i++){let d=0,run=0,best=0,c=0;
   for(let j=0;j<v.w.length;j++){if(cov[i+j])c++;if(t[i+j]!==v.w[j]){d++;run=0}else{run++;best=Math.max(best,run)}}
   if(c<=1&&(d<=1||(d<=2&&best>=2))){add(v);break}}}
 return out}
/* --- full flow: read text -> translate to Hebrew -> link to the trip --- */
const CJK=/[぀-ヿ㐀-鿿ｦ-ﾟ]/;
function cleanJa(t){return t.replace(/(?<=[　-鿿＀-￯])[ \t]+(?=[　-鿿＀-￯])/g,"").replace(/[ \t]+/g," ").trim()}
function pickLines(data){
 const KAN=/[一-鿿]/g;
 const lines=(data.lines||[]).map(l=>({t:cleanJa((l.text||"").replace(/[@*<>_|~^`=#]+/g," ").replace(/(^|\s)[A-Za-z]{1,3}(?=\s|$)/g," ")),c:l.confidence||0}));
 /* keep lines that are mostly Japanese and read with reasonable confidence; drop the noise from trees, walls and shadows.
    weaker lines are kept only if they carry at least two kanji (sign headings are often read with low confidence) */
 const keep=l=>{const nz=l.t.replace(/[\s.,、。・]/g,"");if(!nz)return false;const ja=(nz.match(new RegExp(CJK.source,"g"))||[]).length,kj=(nz.match(KAN)||[]).length,r=ja/nz.length;
  return (l.c>=55&&ja>=2&&r>=.5)||(l.c>=35&&kj>=2&&r>=.7)};
 const good=lines.filter(keep);
 return good.map(l=>l.t.replace(/^[\s.,、・]+|[\s.,・]+$/g,"")).join("\n")}
async function translateJa(text){
 if(!text.trim())return "";
 try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=iw&dt=t&q="+encodeURIComponent(text));if(r.ok){const d=await r.json();const t=(d[0]||[]).map(x=>x[0]).join("");if(t)return t}}catch(e){}
 try{const r=await fetch("https://api.mymemory.translated.net/get?langpair=ja|he&q="+encodeURIComponent(text.slice(0,480)));if(r.ok){const d=await r.json();const t=d.responseData&&d.responseData.translatedText;if(t)return t}}catch(e){}
 try{if(self.Translator){const ok=await Translator.availability({sourceLanguage:"ja",targetLanguage:"he"});if(ok!=="unavailable"){const tr=await Translator.create({sourceLanguage:"ja",targetLanguage:"he"});return await tr.translate(text)}}}catch(e){}
 return null}
const escH=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastImg=null,selBox=null;
function hitsHtml(hits){return hits.length?`<div class="sec">קשור למסע</div><div class="hits">${hits.map(h=>{const t=h.k?TERMS[h.k]:null;
  return `<button ${t?`data-term="${h.k}"`:`data-q="${h.w}"`}><span class="jp">${h.w}</span> <span class="en">${t?t[1].split(" · ")[0]:(h.ro||"")}</span>${t?` · ${t[0]}`:""}</button>`}).join("")}</div>`:""}
async function showResult(ja){
 const out=document.getElementById("ocrOut");
 if(!ja.trim()){out.innerHTML=`<div class="st">לא הצלחתי לקרוא טקסט יפני בתמונה. אפשר לסמן באצבע את השלט בתמונה ולנסות שוב, או לצלם קרוב יותר וישר מולו.</div>`;return}
 out.innerHTML=`<div class="sec">תרגום</div><div class="tr" id="ocrTr">מתרגם…</div>${hitsHtml(findHits(ja))}
  <details class="jaBox"><summary>הטקסט ביפנית (אפשר לתקן)</summary><textarea id="ocrJa" dir="ltr">${escH(ja)}</textarea><button class="x" id="ocrRe">לתרגם שוב</button></details>`;
 const tr=await translateJa(ja);
 document.getElementById("ocrTr").textContent=tr==null?"אין חיבור לאינטרנט, אז אין תרגום כרגע. המילים שקשורות למסע מופיעות למטה.":tr;
 document.getElementById("ocrRe").onclick=()=>showResult(document.getElementById("ocrJa").value);
 const hits=findHits(ja);if(hits.length){const t=hits[0].k?TERMS[hits[0].k]:null;q.value=t?t[0]:hits[0].w;search()}
}
async function ocrCanvas(canvas){
 const st=document.getElementById("ocrSt"),bar=document.getElementById("ocrBar");st.hidden=false;bar.parentNode.hidden=false;
 document.getElementById("ocrOut").innerHTML="";
 await loadTess();
 const r=await Tesseract.recognize(canvas,"jpn",{logger:m=>{if(m.status==="recognizing text"){st.textContent="קורא את הטקסט…";bar.style.width=Math.round(m.progress*100)+"%"}else if(/load/.test(m.status)){st.textContent="מוריד את מילון היפנית (פעם אחת בלבד)…";bar.style.width=Math.round((m.progress||0)*100)+"%"}}});
 st.hidden=true;bar.parentNode.hidden=true;
 return pickLines(r.data)}
function cropCanvas(src,box){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(box.w));c.height=Math.max(1,Math.round(box.h));c.getContext("2d").drawImage(src,box.x,box.y,box.w,box.h,0,0,c.width,c.height);return c}
function prep(c){/* grayscale, stretch contrast, flip white-on-dark */
 const g=c.getContext("2d"),d=g.getImageData(0,0,c.width,c.height),a=d.data;let sum=0,mn=255,mx=0;
 for(let i=0;i<a.length;i+=4){const y=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=y;sum+=y;if(y<mn)mn=y;if(y>mx)mx=y}
 const inv=sum/(a.length/4)<110,k=255/Math.max(1,mx-mn);
 for(let i=0;i<a.length;i+=4){let y=(a[i]-mn)*k;if(inv)y=255-y;a[i]=a[i+1]=a[i+2]=y}
 g.putImageData(d,0,0);return c}
function loadImg(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=2000,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c)};img.src=URL.createObjectURL(file)})}
function setupSelect(cv){
 const wrap=document.getElementById("ocrWrap"),rect=document.getElementById("ocrSel");let st=null;
 const pt=e=>{const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left),y:(e.clientY-b.top),bw:b.width,bh:b.height}};
 cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);st=pt(e);rect.hidden=false;Object.assign(rect.style,{left:st.x+"px",top:st.y+"px",width:"0px",height:"0px"})};
 cv.onpointermove=e=>{if(!st)return;const p=pt(e);const x=Math.min(st.x,p.x),y=Math.min(st.y,p.y),w=Math.abs(p.x-st.x),h=Math.abs(p.y-st.y);Object.assign(rect.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  const sx=lastImg.width/p.bw,sy=lastImg.height/p.bh;selBox={x:x*sx,y:y*sy,w:w*sx,h:h*sy}};
 cv.onpointerup=()=>{st=null;if(selBox&&selBox.w>20&&selBox.h>12){document.getElementById("ocrAgain").hidden=false}else{rect.hidden=true;selBox=null}};
}
async function readSign(f){if(!f)return;
 ocrBox.hidden=false;selBox=null;
 ocrBox.innerHTML=`<div class="wrap" id="ocrWrap"><canvas id="ocrCv"></canvas><div class="sel" id="ocrSel" hidden></div></div>
  <div class="hint">אם יש הרבה רקע, סמנו באצבע מסגרת סביב השלט.</div>
  <button class="x" id="ocrAgain" hidden>לקרוא רק את האזור המסומן</button>
  <div class="st" id="ocrSt">טוען זיהוי טקסט יפני…</div><div class="bar2"><i id="ocrBar"></i></div>
  <div id="ocrOut"></div><button class="x" id="ocrX">סגור</button>`;
 document.getElementById("ocrX").onclick=()=>{ocrBox.hidden=true;ocrBox.innerHTML=""};
 try{
  lastImg=await loadImg(f);
  const cv=document.getElementById("ocrCv");cv.width=lastImg.width;cv.height=lastImg.height;cv.getContext("2d").drawImage(lastImg,0,0);
  setupSelect(cv);
  document.getElementById("ocrAgain").onclick=async()=>{if(!selBox)return;const c=prep(cropCanvas(lastImg,selBox));
   let up=c;if(c.width<900){up=document.createElement("canvas");const k=900/c.width;up.width=900;up.height=c.height*k;up.getContext("2d").drawImage(c,0,0,up.width,up.height)}
   showResult(await ocrCanvas(up))};
  const full=prep(cropCanvas(lastImg,{x:0,y:0,w:lastImg.width,h:lastImg.height}));
  showResult(await ocrCanvas(full));
 }catch(e){document.getElementById("ocrOut").innerHTML=`<div class="st">זיהוי הטקסט לא עבד. בפעם הראשונה צריך אינטרנט כדי להוריד את מילון היפנית.</div>`;const s=document.getElementById("ocrSt");if(s)s.hidden=true}
}
camIn.onchange=()=>{const f=camIn.files[0];camIn.value="";readSign(f)};
const galIn=document.getElementById("galIn");document.getElementById("galBtn").onclick=()=>galIn.click();
galIn.onchange=()=>{const f=galIn.files[0];galIn.value="";readSign(f)};
ocrBox.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(b){q.value=b.dataset.q;search()}});
</script>

<script>
/* Open Japan Transit Planner (Jorudan). Copies the destination so it can be pasted, then opens the app. */
const TP_PKG="jp.co.jorudan.nrkj",TP_PLAY="https://play.google.com/store/apps/details?id="+TP_PKG,TP_IOS="https://apps.apple.com/app/id299490481";
function toast2(m){let t=document.getElementById("toast2");if(!t){t=document.createElement("div");t.id="toast2";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4000)}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-tp-to]");if(!b)return;e.preventDefault();
 const from=b.dataset.tpFrom,to=b.dataset.tpTo;
 try{await navigator.clipboard.writeText(to)}catch(_){}
 toast2(`הועתק: ${to}. באפליקציה: מ־${from} אל ${to} (להדביק ביעד)`);
 const ua=navigator.userAgent;
 setTimeout(()=>{
  if(/Android/i.test(ua))location.href=`intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${TP_PKG};S.browser_fallback_url=${encodeURIComponent(TP_PLAY)};end`;
  else if(/iPhone|iPad|iPod/i.test(ua))location.href=TP_IOS;
  else window.open("https://world.jorudan.co.jp/mln/en/","_blank","noopener");
 },700);
});
</script>

<script>
/* Copy a ready message (WhatsApp etc.) */
document.addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b)return;e.preventDefault();
 const el=document.getElementById(b.dataset.copy);if(!el)return;const t=el.textContent.trim();
 try{await navigator.clipboard.writeText(t);(window.toast2||alert)("ההודעה הועתקה. להדביק בוואטסאפ")}
 catch(_){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);(window.toast2||alert)("סימנתי את ההודעה, להעתיק ידנית")}});
</script>
