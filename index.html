<style>
/* Layout: one quiet white column; the trip as an accordion of stages; each stage is a checklist, finished stages fold away and the next one is lifted */
:root{
  --bg:#ffffff; --fg:#1d1f22; --muted:#73777d; --rule:#ececea; --soft:#f6f6f4; --next:#f2f5f9; --accent:#3d5a80; --done:#5f8f6d; --warn:#9a4f28; --warn-bg:#fbf5f1;
  --f:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:600px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-block:32px 20px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.times{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.times b{color:var(--fg);font-weight:600}

.acc{border-top:1px solid var(--rule)}
.st{border-bottom:1px solid var(--rule);transition:background .25s}
.head{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;width:100%;background:none;border:0;padding:18px 0;text-align:start}
.num{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.head .t{font-size:18px;font-weight:700;line-height:1.3}
.head .d{font-size:14px;color:var(--muted)}
.tag{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{display:inline-block;transition:transform .2s;margin-inline-start:8px}
.st.open .chev{transform:rotate(-90deg)}

.st.done .num,.st.done .tag{color:var(--done)}
.st.done .head .t{color:var(--muted);font-weight:600}
.st.next{background:var(--next);border-radius:10px;border-bottom-color:transparent;margin-block:6px;box-shadow:inset -3px 0 0 var(--accent)}
.st.next .head{padding-inline:14px}
.st.next .body{padding-inline:14px 54px}
.st.next .num,.st.next .tag{color:var(--accent);font-weight:700}
.body{padding:0 40px 22px 0;display:grid;gap:14px}

h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:6px 0 0}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.chk li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:5px 0}
ul.chk input{accent-color:var(--done);width:20px;height:20px;margin:3px 0 0;cursor:pointer}
ul.chk li.ck .txt{color:var(--muted)}
ul.chk li.ck .txt .lbl{text-decoration:line-through}
.txt label{cursor:pointer}
.dur{color:var(--muted);font-size:14px}
.jp{font-family:var(--jp);font-weight:500}
.big{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:16px;font-size:15px}
.warn{font-size:14px;color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:6px}
.key{font-size:15px;background:var(--soft);padding:10px 12px;border-radius:6px}
.show{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:15px;white-space:nowrap}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
dl.facts dt{color:var(--muted)}
dl.tl dt{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.n{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:64px;background:var(--soft);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical}
ul.plain{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:15px}
.cards{display:grid;gap:8px}
.card{display:block;width:100%;text-align:start;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--accent)}
.card .he{font-size:14px;color:var(--muted)}
.card .ja{font-family:var(--jp);font-weight:700;font-size:20px;line-height:1.45;direction:ltr;text-align:right}
.card .ro{font-size:14px;color:var(--muted);direction:ltr;text-align:right}
.card .addr{font-size:13px;color:var(--muted);direction:ltr;text-align:right;font-family:var(--jp)}
.reset{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

#full{position:fixed;inset:0;background:#fff;color:#111;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center}
#full .ja{font-family:var(--jp);font-weight:700;font-size:clamp(30px,8.5vw,56px);line-height:1.4;direction:ltr}
#full .addr{font-family:var(--jp);font-size:clamp(17px,4.5vw,24px);color:#444;direction:ltr}
#full .he{font-size:15px;color:#777}
#full .ro{font-size:clamp(15px,4vw,19px);color:#555;direction:ltr}
#full button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:max(14px,env(safe-area-inset-left,0px));background:#f0f0ee;border:0;border-radius:99px;padding:6px 14px;font-size:15px}
footer{margin-top:32px;font-size:13px;color:var(--muted);display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1><span class="logo" aria-hidden="true"></span>יפן · דצמבר 2026</h1>
  <div class="meta">ברק ועמית · כנס נפילות בטוחות, אוניברסיטת טוקאי</div>

</header>
<div class="locbar" id="locbar"><span class="locdot"></span><span id="locTxt">זיהוי מיקום כבוי</span><button id="locBtn">להפעיל</button></div>
<div class="wx" id="wx"><div class="wh"><b>מזג אוויר</b><div class="tabs" id="wxTabs"></div></div><div class="row" id="wxRow"><div class="note">טוען תחזית…</div></div><div class="note" id="wxNote"></div></div>
<div style="height:12px"></div>
<div class="srch"><span class="ic" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="חיפוש: תחנה, כרטיס, מילה ביפנית…" autocomplete="off" enterkeyhint="search" aria-label="חיפוש"><button class="cam" id="camBtn" type="button">צילום שלט</button><button class="clr" id="qClr" hidden aria-label="ניקוי">×</button><input type="file" id="camIn" accept="image/*" capture="environment" hidden></div>
<div id="ocrBox" hidden></div>
<div id="sres" hidden></div>
<div id="here" hidden role="status" aria-live="polite"><div class="hh" id="hereT"></div><div class="hb" id="hereB"></div><div class="ha" id="hereA"></div></div>
<div class="acc" id="acc"></div>
<footer>
  <span>הסימונים וההערות נשמרים בטלפון הזה בלבד. זמני הנסיעה משוערים; ביום עצמו כדאי לבדוק בגוגל מפות.</span>
  <span><button class="reset" id="reset">לנקות את כל הסימונים</button> <span id="resetAsk" hidden> · בטוח? <button class="reset" id="resetYes">כן, לנקות</button></span></span>
</footer>
</div>

<div id="tip" hidden role="dialog"><div class="in"><div class="h" id="tipH"></div><div><span class="en" id="tipEn"></span> <span class="jp" id="tipJp"></span></div><div id="tipD"></div><button class="x" id="tipX">סגור</button></div></div>
<div id="full" hidden role="dialog" aria-modal="true">
  <button id="close">סגור</button>
  <div class="ja" id="fJa"></div>
  <div class="addr" id="fAddr"></div>

</div>

<script>
const CARDS={
 lost:{he:"הלכנו לאיבוד, אפשר עזרה?",ja:"道に迷いました。\n助けていただけますか？",ro:"Michi ni mayoimashita. Tasukete itadakemasu ka?"},
 jrdesk:{he:"איפה הקופה של JR / נריטה אקספרס?",ja:"JRのきっぷ売り場は\nどこですか？\n成田エクスプレス",ro:"JR no kippu uriba wa doko desu ka? Narita Ekusupuresu"},
 nex:{he:"כרטיס נריטה אקספרס לשינג׳וקו, שני אנשים",ja:"成田エクスプレスで\n新宿まで、大人2枚\nお願いします",ro:"Narita Ekusupuresu de Shinjuku made, otona ni-mai onegaishimasu"},
 nexplat:{he:"איפה הרציף של נריטה אקספרס?",ja:"成田エクスプレスの\n乗り場はどこですか？",ro:"Narita Ekusupuresu no noriba wa doko desu ka?"},
 odakyu:{he:"איפה הרציף של קו אודקיו?",ja:"小田急線の乗り場は\nどこですか？",ro:"Odakyū-sen no noriba wa doko desu ka?"},
 romance:{he:"2 כרטיסי רומנסקאר להון־אצוגי",ja:"ロマンスカーで\n本厚木まで、大人2枚\nお願いします",ro:"Romansukā de Hon-Atsugi made, otona ni-mai onegaishimasu"},
 tsuru:{he:"אנחנו רוצים להגיע לתחנת צורומקי אונסן",ja:"鶴巻温泉駅まで\n行きたいです",ro:"Tsurumaki-Onsen eki made ikitai desu"},

 bldg:{he:"איפה בניין 15? איפה הבודוקאן?",ja:"15号館はどこですか？\n武道館はどこですか？",ro:"Jūgo-gōkan wa doko desu ka? Budōkan wa doko desu ka?"},
 tokaist:{he:"לתחנת טוקאי־דאיגקומאה, בבקשה",ja:"東海大学前駅まで\nお願いします",ro:"Tōkai-Daigakumae eki made onegaishimasu"},
 nexback:{he:"כרטיס נריטה אקספרס לנריטה טרמינל 1, שני אנשים",ja:"成田エクスプレスで\n成田空港 第1ターミナルまで\n大人2枚お願いします",ro:"Narita Kūkō dai-ichi tāminaru made, otona ni-mai onegaishimasu"},
 airport:{he:"הרכבת הזאת נוסעת לנמל התעופה נריטה?",ja:"この電車は\n成田空港に行きますか？",ro:"Kono densha wa Narita Kūkō ni ikimasu ka?"},
 english:{he:"אתם מדברים אנגלית?",ja:"英語を話せますか？",ro:"Eigo o hanasemasu ka?"},
 write:{he:"אפשר לכתוב את זה?",ja:"ここに書いて\nいただけますか？",ro:"Koko ni kaite itadakemasu ka?"},
 help:{he:"חירום: בבקשה תזמינו אמבולנס",ja:"救急車を\n呼んでください",addr:"119",ro:"Kyūkyūsha o yonde kudasai"}

const chk=(pre,items)=>`<ul class="chk">${items.map((x,i)=>{const [l,ex]=Array.isArray(x)?x:[x,""];
  return `<li><input type="checkbox" id="c-${pre}-${i}" data-k="${pre}-${i}"><div class="txt"><label for="c-${pre}-${i}" class="lbl">${l}</label>${ex?" "+ex:""}</div></li>`}).join("")}</ul>`;

/* Place and term dictionary: Hebrew, how it is written in English (as on signs), Japanese, and what it is */
const TERMS={
 narita:["נריטה","Narita","成田","נמל התעופה הבינלאומי של טוקיו, כשעה וחצי ברכבת ממרכז העיר. אל על נוחתת ויוצאת מטרמינל 1."],

const store={get(k,d){try{const v=localStorage.getItem("jp26:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("jp26:"+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.startsWith("jp26:")).forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const mem={}; // fallback when storage is unavailable
const isChecked=k=>k in mem?mem[k]:!!store.get("c:"+k,false);
const keysOf=s=>[...s.html().matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]);
const stat=s=>{const ks=keysOf(s);const d=ks.filter(isChecked).length;return {n:ks.length,d,done:ks.length>0&&d===ks.length}};
const nextIdx=()=>STEPS.findIndex(s=>!s.always&&!stat(s).done);

let open=store.get("open3",null);
if(open===null)open=nextIdx();
const acc=document.getElementById("acc");
function render(){
  const nx=nextIdx();
  acc.innerHTML=STEPS.map((s,i)=>{
    const st=stat(s),isNext=i===nx,isOpen=i===open;
    const tag=s.always?"":st.done?"הושלם":isNext?`הבא · ${st.d}/${st.n}`:st.d?`${st.d}/${st.n}`:"";
    return `<div class="st ${st.done&&!s.always?"done":""} ${isNext?"next":""} ${isOpen?"open":""}" id="${s.id}">
     <button class="head" data-i="${i}" aria-expanded="${isOpen}"><span class="num">${s.always?"·":st.done?"✓":i+1}</span>
      <span><div class="t">${s.t}</div><div class="d">${s.d}</div></span>
      <span class="tag"><span class="tt">${tag}</span><span class="chev">‹</span></span></button>
     <div class="body" ${isOpen?"":"hidden"}>${s.html()}</div></div>`}).join("");
  acc.querySelectorAll("input[data-k]").forEach(c=>{c.checked=isChecked(c.dataset.k);c.closest("li").classList.toggle("ck",c.checked)});
  acc.querySelectorAll("textarea[data-note]").forEach(t=>t.value=store.get("n:"+t.dataset.note,""));
}
function setOpen(i){open=i;store.set("open3",i)}
acc.addEventListener("click",e=>{
  const h=e.target.closest(".head");if(h){const i=+h.dataset.i;setOpen(open===i?-1:i);render()}
});
acc.addEventListener("change",e=>{
  const k=e.target.dataset.k;if(!k)return;
  mem[k]=e.target.checked;store.set("c:"+k,e.target.checked);
  e.target.closest("li").classList.toggle("ck",e.target.checked);
  const i=STEPS.findIndex(s=>keysOf(s).includes(k));
  const st=stat(STEPS[i]);
  // update the header counter without re-rendering the open section
  if(st.done){
    setTimeout(()=>{const nx=nextIdx();setOpen(nx);render();
      if(nx>=0)document.getElementById(STEPS[nx].id).scrollIntoView({behavior:"smooth",block:"start"})},450);
  }else{
    const tag=document.querySelector(`#${STEPS[i].id} .tag`);
    if(tag)tag.querySelector(".tt").textContent=(i===nextIdx()?"הבא · ":"")+`${st.d}/${st.n}`;
  }
});
acc.addEventListener("input",e=>{if(e.target.dataset.note)store.set("n:"+e.target.dataset.note,e.target.value)});

const full=document.getElementById("full");
document.addEventListener("click",e=>{const b=e.target.closest("[data-card]");if(!b)return;e.preventDefault();const c=CARDS[b.dataset.card];if(!c)return;
  document.getElementById("fJa").innerHTML=c.ja.replace(/\n/g,"<br>");
  document.getElementById("fAddr").textContent=c.addr||"";
  document.getElementById("fRo").textContent=c.ro;document.getElementById("fHe").textContent=c.he;
  full.hidden=false;try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
  document.getElementById("close").focus()});
document.getElementById("close").onclick=()=>full.hidden=true;
full.addEventListener("click",e=>{if(e.target===full)full.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")full.hidden=true});

document.getElementById("reset").onclick=()=>document.getElementById("resetAsk").hidden=false;

function fmt(tz){return new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:tz,hour12:false}).format(new Date())}
function tick(){

<script>
/* GPS: works only while the app is open. Finds the nearest trip anchor and jumps to the relevant step. */
const ANCHORS=[
 {id:"tlv",lat:32.0003,lng:34.8705,r:1500,name:"נתב״ג"},
 {id:"narita",lat:35.7647,lng:140.3863,r:1500,name:"נריטה טרמינל 1"},
 {id:"shinjuku",lat:35.6896,lng:139.7006,r:700,name:"שינג׳וקו"},
 {id:"tsuru",lat:35.3811,lng:139.2779,r:650,name:"צורומקי אונסן"},
 {id:"tokai",lat:35.3731,lng:139.2712,r:300,name:"תחנת טוקאי־דאיגקומאה"},
 {id:"campus",lat:35.3635,lng:139.2745,r:700,name:"קמפוס טוקאי"}
];
const isDone=id=>{const s=STEPS.find(x=>x.id===id);return s?stat(s).done:true};
function adviceFor(a){
 const jpDay=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});
 const returning=jpDay>="2026-12-20";
 switch(a.id){
  case "tlv":return {step:"dep",b:"טרמינל 3. מסירת מזוודה, ביקורת ביטחון, עלייה למטוס.",cards:[]};
  case "narita":return returning
   ?{step:"ret",b:"אל על בטרמינל 1. צ׳ק־אין ומסירת מזוודות.",cards:[]}
   :{step:isDone("land")?"toHome":"land",b:"אחרי המכס: יורדים לקומה B1, לקופה של JR. קונים 2 כרטיסי נריטה אקספרס לשינג׳וקו.",cards:[["jrdesk","איפה הקופה"],["nex","כרטיס בקופה"]]};
  case "shinjuku":return returning
   ?{step:"ret",b:"עוברים ל־JR וקונים נריטה אקספרס לטרמינל 1.",cards:[["jrdesk","איפה הקופה"],["nexback","כרטיס בקופה"]]}
   :{step:"toHome",b:"עוקבים אחרי השלטים הכחולים 小田急線 (Odakyū-sen), בצד המערבי. רכבת לכיוון 小田原 (Odawara), סוג 急行 (Kyūkō).",cards:[["odakyu","איפה הרציף"],["stoptsuru","עוצרת בצורומקי?"]]};
  case "tsuru":return !isDone("toHome")
   ?{step:"toHome",b:"הגעתם. 7 דקות הליכה לבית, צ׳ק־אין עצמי עם תיבת מנעול.",cards:[]}
   :{step:nextStepId(),b:"לקמפוס: רכבת לכיוון 小田原 (Odawara), תחנה אחת, עד 東海大学前 (Tōkai-Daigakumae).",cards:[["campus","להראות לנהג"]]};
  case "tokai":return {step:nextStepId(),b:"הליכה של 15–20 דקות לקמפוס, או מונית.",cards:[["campus","להראות לנהג"],["bldg","איפה בניין 15"]]};
  case "campus":return {step:nextStepId(),b:"הרצאות: בניין 15, חדר 611. מעשי: הדוג'ו באולם הבודוקאן.",cards:[["bldg","לשאול איפה"]]};
 }}
function nextStepId(){const i=nextIdx();return i>=0?STEPS[i].id:null}
function dist(a,b,c,d){const R=6371e3,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
let watchId=null,lastAnchor=null;
const locBar=document.getElementById("locbar"),locBtn=document.getElementById("locBtn"),locTxt=document.getElementById("locTxt");
function onPos(p){
 const {latitude:la,longitude:lo}=p.coords;
 let best=null;
 for(const a of ANCHORS){const d=dist(la,lo,a.lat,a.lng);if(d<=a.r&&(!best||d<best.d))best={a,d}}
 if(!best){locTxt.textContent="המיקום פעיל · לא ליד נקודה במסלול";return}
 locTxt.textContent="המיקום פעיל · ליד "+best.a.name;
 if(lastAnchor===best.a.id)return;
 lastAnchor=best.a.id;
 const adv=adviceFor(best.a);if(!adv)return;
 document.getElementById("hereT").textContent="אתם ליד "+best.a.name;
 document.getElementById("hereB").textContent=adv.b;
 document.getElementById("hereA").innerHTML=adv.cards.map(([id,l])=>`<button data-card="${id}">${l}</button>`).join("")+(adv.step?`<button data-goto="${adv.step}">לשלב</button>`:"")+`<button data-x="1">סגור</button>`;
 document.getElementById("here").hidden=false;
 if(adv.step){const i=STEPS.findIndex(s=>s.id===adv.step);if(i>=0){setOpen(i);render()}}
 try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
 try{if("Notification"in window&&Notification.permission==="granted"&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification("אתם ליד "+best.a.name,{body:adv.b,icon:"icon-192.png",tag:"here"}))}catch(e){}
}
function onErr(e){locTxt.textContent=e.code===1?"אין הרשאת מיקום. לאשר בהגדרות הדפדפן":"לא מצליח לקבל מיקום כרגע"}
function startLoc(){
 if(!navigator.geolocation){locTxt.textContent="הדפדפן לא תומך במיקום";return}
 watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:30000,timeout:20000});
 locBar.classList.add("on");locBtn.classList.add("on");locBtn.textContent="לכבות";locTxt.textContent="מחפש מיקום…";
 try{localStorage.setItem("jp26:loc","1")}catch(e){}
 try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
}
function stopLoc(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;lastAnchor=null;
 locBar.classList.remove("on");locBtn.classList.remove("on");locBtn.textContent="להפעיל";locTxt.textContent="זיהוי מיקום כבוי";
 try{localStorage.setItem("jp26:loc","0")}catch(e){}}
locBtn.onclick=()=>watchId===null?startLoc():stopLoc();
document.getElementById("hereA").addEventListener("click",e=>{
 const g=e.target.closest("[data-goto]");if(g){const i=STEPS.findIndex(s=>s.id===g.dataset.goto);setOpen(i);render();document.getElementById(g.dataset.goto).scrollIntoView({behavior:"smooth",block:"start"})}
 if(e.target.closest("[data-x]"))document.getElementById("here").hidden=true;
});
try{if(localStorage.getItem("jp26:loc")==="1")startLoc()}catch(e){}
</script>

<script>
/* Weather: Open-Meteo (free, no key). Live forecast covers 16 days; before that, December averages. Last result kept for offline. */
const WXP=[
 {id:"hadano",name:"הבית והכנס",en:"Hadano",lat:35.381,lng:139.278},
 {id:"tokyo",name:"טוקיו",en:"Tokyo",lat:35.690,lng:139.700}
];
const TRIP_FROM="2026-12-10",TRIP_TO="2026-12-24";
const WMO=c=>c===0?["☀","בהיר"]:c<=2?["⛅","מעונן חלקית"]:c===3?["☁","מעונן"]:c<=48?["🌫","ערפל"]:c<=57?["🌦","טפטוף"]:c<=67?["☂","גשם"]:c<=77?["❄","שלג"]:c<=82?["☂","ממטרים"]:c<=86?["❄","שלג"]:["⛈","סופה"];
const HEDAY=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
let wxPlace=(()=>{try{return localStorage.getItem("jp26:wxp")||"hadano"}catch(e){return "hadano"}})();
const wxTabs=document.getElementById("wxTabs"),wxRow=document.getElementById("wxRow"),wxNote=document.getElementById("wxNote");
function wxDrawTabs(){wxTabs.innerHTML=WXP.map(p=>`<button data-p="${p.id}" aria-pressed="${p.id===wxPlace}">${p.name} <span style="direction:ltr;unicode-bidi:isolate">${p.en}</span></button>`).join("")}
wxTabs.onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;wxPlace=b.dataset.p;try{localStorage.setItem("jp26:wxp",wxPlace)}catch(e){}wxDrawTabs();wxLoad()};
function wxDraw(d,stale){
 const days=d.daily.time.map((t,i)=>({t,mx:Math.round(d.daily.temperature_2m_max[i]),mn:Math.round(d.daily.temperature_2m_min[i]),p:d.daily.precipitation_probability_max?.[i],c:d.daily.weather_code[i]}));
 const todayJP=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});
 const inTrip=todayJP>=TRIP_FROM&&todayJP<=TRIP_TO;
 const show=days.filter(x=>inTrip?x.t>=todayJP:(x.t>=TRIP_FROM&&x.t<=TRIP_TO));
 const lastDay=days[days.length-1].t;
 if(!show.length){
  wxRow.innerHTML=`<div class="d"><div class="i">❄</div><div class="t"><b>11°</b> <span>3°</span></div><div>ממוצע דצמבר</div></div>`;
  const avail=new Date(new Date(TRIP_FROM)-15*864e5).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
  wxNote.textContent=`התחזית לימי הנסיעה תופיע כאן מ־${avail} בערך. בינתיים: בדצמבר בדרך כלל יבש ושמשי, 9–12° ביום ו־1–5° בלילה. בבקרים קר.`;
  return}
 wxRow.innerHTML=show.map(x=>{const [i,l]=WMO(x.c);const dt=new Date(x.t+"T12:00:00+09:00");const trip=x.t>=TRIP_FROM&&x.t<=TRIP_TO;
  return `<div class="d ${trip?"trip":""} ${x.p>=50?"rain":""}" title="${l}"><div>${HEDAY[dt.getUTCDay()]} ${dt.getUTCDate()}.${dt.getUTCMonth()+1}</div><div class="i" aria-label="${l}">${i}</div><div class="t"><b>${x.mx}°</b> <span>${x.mn}°</span></div>${x.p!=null?`<div class="p">${x.p}%☂</div>`:""}</div>`}).join("");
 const rainy=show.filter(x=>x.p>=50).map(x=>new Date(x.t+"T12:00:00+09:00").getUTCDate()+".12");
 const cold=Math.min(...show.map(x=>x.mn));
 wxNote.textContent=(stale?"תחזית שמורה (אין חיבור). ":"")+
  (show[show.length-1].t<TRIP_TO&&lastDay<TRIP_TO&&!inTrip?"התחזית מגיעה עד "+lastDay.slice(8)+"."+lastDay.slice(5,7)+". ":"")+
  (rainy.length?"מטריה ב־"+rainy.join(", ")+". ":"")+(cold<=3?"לילות קרים, עד "+cold+"°. ":"");
}
async function wxLoad(){
 const p=WXP.find(x=>x.id===wxPlace)||WXP[0];
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`;
 try{const r=await fetch(url);if(!r.ok)throw 0;const d=await r.json();try{localStorage.setItem("jp26:wx:"+p.id,JSON.stringify(d))}catch(e){}wxDraw(d,false)}
 catch(e){let d=null;try{d=JSON.parse(localStorage.getItem("jp26:wx:"+p.id))}catch(_){}
  if(d)wxDraw(d,true);else{wxRow.innerHTML="";wxNote.textContent="אין חיבור לאינטרנט כרגע, אז אין תחזית."}}
}
wxDrawTabs();wxLoad();setInterval(wxLoad,3*3600e3);
</script>

<script>
/* Search across stages, show-cards and the glossary. Matches Hebrew, English, romaji (with or without long vowels) and Japanese. */
const norm=t=>(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\u0591-\u05c7]/g,"").replace(/[׳״'"`’\-–—·.,:;()?!]/g," ").replace(/\s+/g," ").trim();
const SEL="li,.warn,.key,dd,.sub,.big";
let IDX=null;
function buildIdx(){
 IDX=[];
 STEPS.forEach((st,si)=>{if(st.always)return;const box=document.createElement("div");box.innerHTML=st.html();
  box.querySelectorAll(SEL).forEach((el,ei)=>{const tx=el.textContent.replace(/\s+/g," ").trim();if(tx.length>2)IDX.push({k:"step",si,ei,title:st.t,txt:tx,n:norm(tx+" "+st.t)})});
  IDX.push({k:"step",si,ei:-1,title:st.t,txt:st.d,n:norm(st.t+" "+st.d)})});
 Object.entries(CARDS).forEach(([id,c])=>IDX.push({k:"card",id,title:c.he,txt:c.ro,ja:c.ja.replace(/\n/g,""),n:norm([c.he,c.ro,c.ja,c.addr].join(" "))}));
 Object.entries(TERMS).forEach(([id,t])=>IDX.push({k:"term",id,title:t[0],txt:t[1],ja:t[2],n:norm(t.join(" "))}));
}
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(t,words){let h=esc(t);for(const w of words){if(w.length<2)continue;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");h=h.replace(re,"<mark>$1</mark>")}return h}
function snippet(t,w){if(t.length<=110)return t;const i=Math.max(0,norm(t).indexOf(w)-40);return (i>0?"…":"")+t.slice(i,i+110)+"…"}
const q=document.getElementById("q"),sres=document.getElementById("sres"),qClr=document.getElementById("qClr"),accEl=document.getElementById("acc");
function search(){
 const raw=q.value.trim();qClr.hidden=!raw;
 if(!raw){sres.hidden=true;accEl.hidden=false;return}
 if(!IDX)buildIdx();
 const words=norm(raw).split(" ").filter(Boolean);
 const hits=IDX.filter(x=>{const c=x.c||(x.c=x.n.replace(/ /g,""));return words.every(w=>x.n.includes(w)||c.includes(w))});
 const groups=[["card","כרטיסים להראות"],["term","מקומות ומונחים"],["step","בשלבים"]];
 let html="";
 for(const [k,lab] of groups){const g=hits.filter(h=>h.k===k).slice(0,k==="step"?12:8);if(!g.length)continue;
  html+=`<div class="hd">${lab}</div>`+g.map(h=>{
   if(k==="card")return `<button class="r" data-card="${h.id}"><div class="x">${hl(h.title,words)}</div><div class="y"><span class="jp">${esc(h.ja)}</span> · ${hl(h.txt,words)}</div></button>`;
   if(k==="term")return `<button class="r" data-term="${h.id}"><div class="x">${hl(h.title,words)} <span class="y">${hl(h.txt,words)}</span></div>${h.ja?`<div class="y"><span class="jp">${esc(h.ja)}</span></div>`:""}</button>`;
   return `<button class="r" data-sgo="${h.si}:${h.ei}"><div class="w">${esc(h.title)}</div><div class="x">${hl(snippet(h.txt,words[0]),words)}</div></button>`}).join("")}
 sres.innerHTML=html||`<div class="none">לא נמצא. אפשר לנסות בעברית, באנגלית או ביפנית.</div>`;
 sres.hidden=false;accEl.hidden=true;
}
q.addEventListener("input",search);
qClr.onclick=()=>{q.value="";search();q.focus()};
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";search()}});
sres.addEventListener("click",e=>{const b=e.target.closest("[data-sgo]");if(!b)return;
 const [si,ei]=b.dataset.sgo.split(":").map(Number);
 q.value="";search();setOpen(si);render();
 const stEl=document.getElementById(STEPS[si].id);
 const target=ei>=0?stEl.querySelectorAll(".body "+SEL.split(",").join(",.body "))[ei]:stEl;
 (target||stEl).scrollIntoView({behavior:"smooth",block:"center"});
 if(target){target.classList.remove("flash");void target.offsetWidth;target.classList.add("flash")}
});
</script>

<script>
/* Photo of a sign -> Japanese text recognition on the phone (Tesseract, loaded on first use) -> known words in the app */
const camBtn=document.getElementById("camBtn"),camIn=document.getElementById("camIn"),ocrBox=document.getElementById("ocrBox");
camBtn.onclick=()=>camIn.click();
let tessLoad=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(!tessLoad)tessLoad=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});return tessLoad}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);res(c)};img.src=URL.createObjectURL(file)})}
function vocab(){const v=[];for(const [k,t] of Object.entries(TERMS)){if(t[2])v.push({w:t[2].replace(/\s/g,""),k})}
 for(const [jp,ro] of Object.entries(JR)){if(!v.some(x=>x.w===jp)){const k=Object.keys(TERMS).find(k=>TERMS[k][2]===jp);v.push({w:jp,k,ro})}}
 v.push({w:"切符売り場",k:"s_kippu"},{w:"お手洗い",k:"s_toilet"},{w:"東海大学",k:"tokai"},{w:"湘南",k:"shonan"},{w:"各停",k:"kakueki"},{w:"空港",k:"narita"},{w:"小田急",k:"odakyu"},{w:"禁煙",k:"s_kin"});
 return v.sort((a,b)=>b.w.length-a.w.length)}
function findHits(text){const t=text.replace(/\s/g,"");const out=[],seen=new Set();
 for(const v of vocab()){let ok=t.includes(v.w);
  if(!ok&&v.w.length>=4){for(let i=0;i+v.w.length<=t.length&&!ok;i++){let d=0;for(let j=0;j<v.w.length;j++)if(t[i+j]!==v.w[j]&&++d>1)break;if(d<=1)ok=true}}
  if(ok){const key=v.k||v.w;if(!seen.has(key)){seen.add(key);out.push(v)}}}
 return out}
camIn.onchange=async()=>{const f=camIn.files[0];camIn.value="";if(!f)return;
 const url=URL.createObjectURL(f);
 ocrBox.hidden=false;ocrBox.innerHTML=`<img src="${url}" alt="התמונה שצולמה"><div class="st" id="ocrSt">טוען זיהוי טקסט יפני… בפעם הראשונה זה לוקח קצת זמן</div><div class="bar2"><i id="ocrBar"></i></div>`;
 try{await loadTess();
  const canvas=await shrink(f);
  const r=await Tesseract.recognize(canvas,"jpn",{logger:m=>{const st=document.getElementById("ocrSt"),b=document.getElementById("ocrBar");if(!st)return;
   if(m.status==="recognizing text"){st.textContent="מזהה טקסט…";b.style.width=Math.round(m.progress*100)+"%"}else if(/load/.test(m.status)){st.textContent="מוריד את מילון היפנית (פעם אחת בלבד)…";b.style.width=Math.round((m.progress||0)*100)+"%"}}});
  const text=(r.data.text||"").trim();const hits=findHits(text);
  ocrBox.innerHTML=`<img src="${url}" alt="התמונה שצולמה">`+
   (hits.length?`<div class="st">נמצא בתמונה:</div><div class="hits">${hits.map(h=>{const t=h.k?TERMS[h.k]:null;
     return `<button ${t?`data-term="${h.k}"`:`data-q="${h.w}"`}><span class="jp">${h.w}</span> <span class="en">${t?t[1].split(" · ")[0]:(h.ro||"")}</span>${t?` · ${t[0]}`:""}</button>`}).join("")}</div>`
    :`<div class="st">לא זיהיתי בתמונה מילה שמופיעה באפליקציה. כדאי לצלם קרוב יותר, ישר מול השלט. לתרגום של כל השלט: מצב מצלמה ב־Google Translate.</div>`)+
   (text?`<div class="raw">זוהה: ${text.replace(/[<>&]/g,"").slice(0,160)}</div>`:"")+
   `<button class="x" id="ocrX">סגור</button>`;
  document.getElementById("ocrX").onclick=()=>{ocrBox.hidden=true;ocrBox.innerHTML=""};
  if(hits.length){const t=hits[0].k?TERMS[hits[0].k]:null;q.value=t?t[0]:hits[0].w;search()}
 }catch(e){ocrBox.innerHTML=`<div class="st">זיהוי הטקסט לא עבד. צריך אינטרנט בפעם הראשונה כדי להוריד את מילון היפנית.</div><button class="x" onclick="ocrBox.hidden=true">סגור</button>`}
};
ocrBox.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(b){q.value=b.dataset.q;search()}});
</script>
